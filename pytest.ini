[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    integration: requires Iceberg-enabled Spark (slower; set SKIP_ICEBERG=1 to skip)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
