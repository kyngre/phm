# Iceberg REST Catalog + S3 (MinIO)
# (JAR은 커스텀 이미지에 사전 포함됨)
#
# 자격증명은 이 파일에 두지 않는다.
# AWS SDK v1 (S3A) / v2 (S3FileIO) 모두 EnvironmentVariableCredentialsProvider 가
# 기본 credential chain 에 포함되어 있어 컨테이너 env 의 AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY / AWS_REGION 으로 자동 resolve 됨 (compose .env → 컨테이너 env).

spark.sql.extensions                               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Iceberg REST 카탈로그 (이름: phm)
spark.sql.catalog.phm                              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.phm.type                         rest
spark.sql.catalog.phm.uri                          http://iceberg-rest:8181
spark.sql.catalog.phm.warehouse                    s3://warehouse/
spark.sql.catalog.phm.io-impl                      org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.phm.s3.endpoint                  http://minio:9000
spark.sql.catalog.phm.s3.path-style-access         true

spark.sql.defaultCatalog                           phm

# S3A (raw 파일 직접 읽기, remove_orphan_files 의 Hadoop FileSystem list 등)
spark.hadoop.fs.s3a.endpoint                       http://minio:9000
spark.hadoop.fs.s3a.path.style.access              true
spark.hadoop.fs.s3a.connection.ssl.enabled         false
spark.hadoop.fs.s3a.impl                           org.apache.hadoop.fs.s3a.S3AFileSystem
# warehouse URL 이 s3:// (not s3a://) → s3 scheme 도 S3A 로 라우팅.
# remove_orphan_files 가 warehouse 를 list 할 때 이 매핑이 필수.
spark.hadoop.fs.s3.impl                            org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.endpoint                        http://minio:9000
spark.hadoop.fs.s3.path.style.access               true
